<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field View — Mobile Bottom Sheet (fieldview-shell mockup)</title>
<style>
  :root {
    --base: #ffffff;
    --panel: #f4f4f5;
    --border: #d4d4d8;
    --pink: #be185d;
    --text: #18181b;
    --text-secondary: #71717a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
  body {
    font-family: "JetBrains Mono", monospace;
    background: var(--base);
    color: var(--text);
    height: 100vh;
    width: 390px; /* iPhone-width reference frame */
    margin: 0 auto;
    overflow: hidden;
    position: relative;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .field-full {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--base);
  }
  .field {
    width: 82%;
    height: 92%;
    border: 2px solid var(--text);
    position: relative;
  }
  .attack-arrow {
    position: absolute; top: -22px; left: 0; right: 0;
    text-align: center; font-size: 9px; color: var(--pink); letter-spacing: 0.1em;
  }
  .endzone { position: absolute; left: 0; right: 0; height: 15%; border-bottom: 1px dashed var(--border); }
  .endzone.bottom { top: auto; bottom: 0; border-bottom: none; border-top: 1px dashed var(--border); }
  .piece {
    position: absolute;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: white; font-weight: bold;
    transform: translate(-50%, -50%);
  }
  .piece.off { background: #4F941D; }
  .piece.def { background: #D64B4A; }

  /* collapsed handle bar, always visible above the sheet */
  .sheet-handle {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--base);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 5;
  }
  .handle-ribbon {
    display: flex;
    flex: 1;
  }
  .handle-btn {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 9px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .handle-btn:last-child { border-right: none; }
  .handle-btn.active { color: var(--pink); }
  .handle-btn.disabled { color: var(--text-secondary); }
  .handle-btn .icon { font-size: 15px; }

  /* expanded sheet, drawn on top for this static mock */
  .sheet-expanded {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46%;
    background: var(--base);
    border-top: 1px solid var(--border);
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  .sheet-grabber {
    width: 36px; height: 4px;
    background: var(--border);
    margin: 8px auto;
  }
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
  }
  .section-label {
    font-size: 10px; color: var(--text-secondary); letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .toggle-row { display: flex; margin-bottom: 12px; }
  .toggle-row button {
    flex: 1;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--base);
    margin-left: -1px;
  }
  .toggle-row button.on { background: var(--text); color: var(--base); border-color: var(--text); }
  .sheet-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .sheet-tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-size: 10px;
    border-right: 1px solid var(--border);
  }
  .sheet-tab.active { color: var(--pink); }
  .caption {
    position: absolute;
    top: 8px; left: 8px;
    font-size: 9px;
    color: var(--text-secondary);
    background: rgba(244,244,245,0.9);
    padding: 3px 6px;
    z-index: 20;
  }
</style>
</head>
<body>
  <div class="caption">MOBILE — SHEET EXPANDED (390px viewport reference)</div>
  <div class="field-full">
    <div class="field">
      <div class="attack-arrow">↑ ATTACKING</div>
      <div class="endzone"></div>
      <div class="piece off" style="top: 60%; left: 45%;">C1</div>
      <div class="piece def" style="top: 45%; left: 60%;">D1</div>
      <div class="endzone bottom"></div>
    </div>
  </div>

  <div class="sheet-expanded">
    <div class="sheet-grabber"></div>
    <div class="sheet-tabs">
      <div class="sheet-tab active">TOOLS</div>
      <div class="sheet-tab">SELECTION</div>
      <div class="sheet-tab">SETTINGS</div>
    </div>
    <div class="sheet-body">
      <div class="section-label" style="margin-top: 12px;">VISIBILITY</div>
      <div class="toggle-row">
        <button class="on">OFFENSE</button>
        <button class="on">DEFENSE</button>
      </div>
      <div class="section-label">TOOLS</div>
      <div class="toggle-row">
        <button class="on">MARQUEE</button>
        <button disabled>THROW</button>
      </div>
    </div>
  </div>
</body>
</html>
