[project]
name = "ulti-pedia"
version = "0.1.0"
description = "Ulti-pedia knowledge-intake backend (form + AI interview)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.6",
    "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# For running migrations directly against Postgres (optional — you can paste
# backend/app/db/schema.sql into the Supabase SQL Editor instead).
ops = [
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
